version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    versioning-strategy: increase
    reviewers:
      - utarwyn
    ignore:
      - dependency-name: '@types/node'
        versions: ['>16'] # stick to node 16
    groups:
      minor-all:
        patterns:
          - '*'
        exclude-patterns:
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
      major-all:
        patterns:
          - '*'
        exclude-patterns:
          - 'typescript'
        update-types:
          - 'major'
      major-typescript:
        patterns:
          - 'typescript'
        update-types:
          - 'patch'
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    reviewers:
      - utarwyn
